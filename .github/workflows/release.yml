name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version without v
        required: true
        type: string
      commit_sha:
        description: Exact checked commit on protected main
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Validate approved target
        env:
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
          test "$(php -r '$m=json_decode(file_get_contents("module.json"),true); echo $m["version"];')" = "$VERSION"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          grep -Fq "## [$VERSION]" CHANGELOG.md
          ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"
      - name: Test and package
        run: |
          composer install --no-interaction --no-progress
          composer lint
          composer test
          composer audit --locked
          php scripts/package.php
          (cd build && sha256sum --check SHA256SUMS)
      - name: Attest release ZIP
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: build/rondo-integration.zip
      - name: Create and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            build/module.json \
            build/rondo-integration.zip \
            build/SHA256SUMS \
            build/rondo-integration.spdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "Rondo Integration v$VERSION" \
            --generate-notes \
            --draft
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify public stable assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for asset in module.json rondo-integration.zip SHA256SUMS rondo-integration.spdx.json; do
            curl --fail --silent --show-error --location --proto '=https' "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$asset" -o "/tmp/$asset"
          done
          curl --fail --silent --show-error --location --proto '=https' "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/module.json" -o /tmp/latest-module.json
          test "$(php -r '$m=json_decode(file_get_contents("/tmp/latest-module.json"),true); echo $m["version"];')" = "$VERSION"
          (cd /tmp && sha256sum --check SHA256SUMS)
